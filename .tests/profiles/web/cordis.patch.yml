# v0.2.1f smoke: dashr-repl row config override (restating the bundle row's
# python expression per the whole-row-restate contract). 2026-09-17 component
# split: hashline/urlSchemes gates moved to the dashr-url-schemes row (its own
# schema defaults are both ON); trustedPageAuthorities/mobile moved to the
# dashr-web-trust / dashr-mobile rows.
- id: dashr-repl
  config:
    python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'
    snapshotDir: /home/u1/workspaces/dashr/.dsh-test/snapshots

