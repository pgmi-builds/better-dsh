# DASHR bundle patch: six component rows on the HOST plane (spec
# docs/specs/plugins-page-components/spec.md). Each insert is one toggleable
# component on the native Plugins page; a row toggle writes `{id, disabled}`
# into the profile's user patch layer and applies live. The rows share no
# inject edges — each degrades gracefully when its dependencies (host
# services, not sibling rows) are absent.
#
# `dashr-repl` (core): the `eval` tool and persistent-kernel REPL runtime land
# in the global scope layer, so every agent in every preset sees them
# (`agent → preset → global`). One process-global runtime keys one kernel per
# Session/Agent, torn down on `agent/disposed` — the promotion of the v0.1.5
# DashrDaemon shell. The tool is an ordinary registration: upstream's `code`
# preset still applies its own `tools:code-only` rule (a direct `eval` call in
# a PTC session resolves to UNKNOWN_TOOL). DASHR ships no PTC mode, so that
# rule never bites here.
#
# `python` is only a hint: the runtime OWNS the kernel environment. An
# explicit interpreter (DASHR_KERNEL_PYTHON) is verified; the bare
- insert:
    - id: dashr-repl
      name: 'better-dsh'
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'

    # URL-aware I/O + hashline + devices. Gates ride THIS row's config
    # (schema defaults: both ON — opt-out), no longer the core row's.
    - id: dashr-url-schemes
      name: 'better-dsh/url-schemes'

    # LLM failover (settings-driven; the row config is the chain base —
    # both slots default "not set").
    - id: dashr-failover
      name: 'better-dsh/failover'

    # Auto-compaction threshold preference (settings-driven).
    - id: dashr-compaction-tuning
      name: 'better-dsh/compaction-tuning'

    # Trusted page authorities leg of the boot script (browser-side twin of
    # the connection fence below). Schema default derives trustedPageAuthorities
    # from DSH_TRUSTED_HOSTS (v0.2.2a ruling: schema defaults, not patch
    # config — they survive every overlay layer; an explicit value still wins).
    - id: dashr-web-trust
      name: 'better-dsh/web-trust'

    # Mobile responsiveness leg of the boot script (gestures payload +
    # zoomGuard section). All knobs default ON; `enabled: false` opts out.
    - id: dashr-mobile
      name: 'better-dsh/mobile'

    # Remote execution framework (plan 2026-09-23-remote-framework-impl.md):
    # `remote` tool face — two-track (oneshot default / pty opt-in), CLI
    # transports (ssh/docker/incus), BYO-PTY spawn, nonce framing, 10min TTL.
    # All config defaults, so the row carries no config block.
    - id: dashr-remote
      name: 'better-dsh/remote'

# Native compaction at the host plane: the base bundle ships the engine, the
# `/compact` command, and the tool-result pruner as host rows; dsh-web-app
# disables them to move compaction behind per-session presets. DASHR is
# host-plane, so re-enable them here (upstream defaults: threshold 0.8, retain
# 0.16). Applied last in bundle order, overriding dsh-web-app's disable.
- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false

# Web-trust fence authorities (v0.2.1f): override the connection row the
# dsh-web-app bundle declares (same id), restating its full shape per the
# patch-layer contract, with `trustedHosts` merging the DSH_TRUSTED_HOSTS
# environment (whitespace-separated, operator-declared serving authorities)
# ahead of the upstream webRuntime-derived ones (LAN literals from an
# all-interface bind plus --trusted-host extras). Unset/empty env ⇒ identical
# behavior to the unpatched row. Malformed entries fail plugin load loudly
# (upstream assertTrustedAuthority). The browser-side twin (page-authority
# loopback verdict) is the plugin's webserver/index-inject boot script —
# see src/web-trust.ts.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime]
  config:
    trustedHosts: !!js (process.env.DSH_TRUSTED_HOSTS ?? '').split(/\s+/).filter(Boolean).concat(ctx.webRuntime.trustedHosts)
