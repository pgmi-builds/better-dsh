# DASHR bundle patch: mounts `dashr-repl` on the HOST plane. Its `eval` tool
# and persistent-kernel REPL runtime land in the global scope layer, so every
# agent in every preset sees them (`agent → preset → global`). One
# process-global runtime keys one kernel per Session/Agent, torn down on
# `agent/disposed` — the promotion of the v0.1.5 DashrDaemon shell.
#
# The tool is an ordinary registration: upstream's `code` preset still applies
# its own `tools:code-only` rule (a direct `eval` call in a PTC session resolves
# to UNKNOWN_TOOL). DASHR ships no PTC mode, so that rule never bites here.
#
# `python` is only a hint: the runtime OWNS the kernel environment. An
# explicit interpreter (DASHR_KERNEL_PYTHON) is verified; the bare
- insert:
    - id: dashr-repl
      name: '@pgmi-builds/better-dsh'
      config:
        python: !!js process.env.DASHR_KERNEL_PYTHON ?? 'python3'

# Native compaction at the host plane: the base bundle ships the engine, the
# `/compact` command, and the tool-result pruner as host rows; dsh-web-app
# disables them to move compaction behind per-session presets. DASHR is
# host-plane, so re-enable them here (upstream defaults: threshold 0.8, retain
# 0.16). Applied last in bundle order, overriding dsh-web-app's disable.
- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false
